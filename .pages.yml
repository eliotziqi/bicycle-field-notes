media:
  input: public/media
  output: /bicycle-field-notes/media
content:
  - name: posts
    label: Blog Posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: [pubDate]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        type: string
        required: true
        pattern:
          regex: '\S'
          message: "Enter meaningful text; spaces alone are not valid."
      - name: description
        type: text
        required: true
        pattern:
          regex: '\S'
          message: "Enter meaningful text; spaces alone are not valid."
      - name: pubDate
        label: Published
        type: string
        default: ""
        pattern: '^$|^[0-9]{4}-(0[1-9]|1[0-2])$'
        description: "YYYY-MM. Leave blank to initialize to the current UTC month after saving; refresh after the workflow finishes."
      - name: updatedDate
        label: Updated
        type: string
        default: ""
        pattern: '^$|^[0-9]{4}-(0[1-9]|1[0-2])$'
        description: "YYYY-MM. Subsequent edits update this month automatically; a manual change takes precedence for that save."
      - name: experience
        label: Experience
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{fields.start} – {fields.end}"
        description: "Optional month ranges in display order. Complete both months in each added row, or delete the unfinished row. Saved content is checked before publication; end must be at or after start."
        fields:
          - name: start
            label: Start month
            type: string
            required: true
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
            description: "YYYY-MM"
          - name: end
            label: End month
            type: string
            required: true
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
            description: "YYYY-MM; repeat the start month for a single month."
      - name: tags
        type: string
        list: true
      - name: featured
        type: boolean
        default: false
      - name: draft
        type: boolean
        default: true
      - name: relatedPlaces
        label: Related Places (narrative order)
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{index}: {fields.place}"
        description: "Optional. Select a Place in each added row, or delete the unfinished row. Repeated mentions and narrative order are preserved."
        fields:
          - name: place
            type: reference
            required: true
            options:
              collection: places
              search: "name,fields.name,fields.id"
              value: "{fields.id}"
              label: "{primary} ({fields.id})"
      - name: relatedTrips
        label: Related Trips (narrative order)
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{index}: {fields.trip}"
        description: "Optional. Select a Trip in each added row, or delete the unfinished row. Order is preserved; adding a Trip does not assert visits."
        fields:
          - name: trip
            type: reference
            required: true
            options:
              collection: trips
              search: "name,fields.name,fields.id"
              value: "{fields.id}"
              label: "{primary} ({fields.id})"
      - name: body
        type: rich-text
  - name: gallery
    label: Gallery
    type: collection
    path: src/content/gallery
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: image
        type: image
        required: true
        options:
          extensions: [jpg, jpeg, png, webp, avif]
      - name: title
        type: string
        required: true
        pattern:
          regex: '\S'
          message: "Enter meaningful text; spaces alone are not valid."
      - name: description
        type: text
        required: true
        pattern:
          regex: '\S'
          message: "Enter meaningful text; spaces alone are not valid."
      - name: categories
        type: reference
        required: true
        options:
          collection: galleryCategories
          multiple: true
          min: 1
          value: "{primary}"
          label: "{primary}"
      - name: relatedPost
        label: Related post (optional)
        type: reference
        options:
          collection: posts
          value: "{path}"
          label: "{primary}"
      - name: showOnHomepage
        label: Show on homepage
        type: boolean
        default: false
  - name: galleryCategories
    label: Gallery Categories
    type: collection
    path: src/content/gallery-categories
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        type: string
        required: true
        pattern:
          regex: '\S'
          message: "Enter meaningful text; spaces alone are not valid."
  - name: places
    label: Places
    type: collection
    path: src/content/places
    format: json
    filename: "{fields.id}.json"
    view:
      primary: name
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "Choose a unique ID on creation. Keep it and the filename unchanged; Trips store this ID. Do not delete a Place used by a Trip: references are not automatically repaired."
      - name: name
        type: string
        required: true
        pattern:
          regex: '\S'
          message: "Enter meaningful text; spaces alone are not valid."
      - name: latitude
        type: number
        required: true
        options:
          min: -90
          max: 90
          step: 0.000001
      - name: longitude
        type: number
        required: true
        options:
          min: -180
          max: 180
          step: 0.000001
      - name: description
        type: text
        required: true
        pattern:
          regex: '\S'
          message: "Enter meaningful text; spaces alone are not valid."
      - name: status
        type: select
        required: true
        options:
          multiple: true
          values:
            - label: Ridden
              value: ridden
            - label: Visited
              value: visited
            - label: Wishlist
              value: wishlist
      - name: coverImage
        label: Cover photo (optional)
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, avif]
  - name: trips
    label: Trips
    type: collection
    path: src/content/trips
    format: json
    filename: "{fields.id}.json"
    view:
      primary: name
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "Choose a unique ID on creation. Keep it and the filename unchanged after saving."
      - name: name
        type: string
        required: true
        pattern:
          regex: '\S'
          message: "Enter meaningful text; spaces alone are not valid."
      - name: startDate
        label: Start date (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: places
        label: Places in visiting order
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: false
            summary: "{index}: {fields.place}"
        description: "Add one row per visit, including return visits. Drag rows to change visiting order."
        fields:
          - name: place
            type: reference
            required: true
            options:
              collection: places
              search: "name,fields.name,fields.id"
              value: "{fields.id}"
              label: "{primary} ({fields.id})"
      - name: description
        label: Description (optional)
        type: text
actions:
  - name: validate-publish
    label: Validate and publish saved changes
    workflow: deploy.yml
    ref: main
    confirm:
      title: Validate and publish saved changes?
      message: "Checks all saved content on main. Only a successful validation and production build can deploy. Failed checks preserve your saved edits."
      button: Validate and publish
