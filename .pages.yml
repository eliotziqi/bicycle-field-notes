media:
  input: public/media
  output: /bicycle-field-notes/media
content:
  - name: posts
    label: Blog Posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: [pubDate]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: pubDate
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: Updated date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: tags
        type: string
        list: true
      - name: featured
        type: boolean
        default: false
      - name: draft
        type: boolean
        default: true
      - name: contentType
        label: Content type (optional)
        type: select
        options:
          values:
            - label: Ride
              value: ride
            - label: Travel
              value: travel
            - label: Guide
              value: guide
            - label: Field Note
              value: field-note
      - name: relatedPlaces
        label: Related Places (narrative order)
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{index}: {fields.place}"
        description: "Optional. Add one row per mention, including repeats. This is article order, independent of a Trip's visiting order."
        fields:
          - name: place
            type: reference
            required: true
            options:
              collection: places
              search: "name,fields.name,fields.id"
              value: "{fields.id}"
              label: "{primary} ({fields.id})"
      - name: relatedTrips
        label: Related Trips (narrative order)
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{index}: {fields.trip}"
        description: "Optional. Order the Trips mentioned in this article. Adding a Trip does not assert a visit to all its Places."
        fields:
          - name: trip
            type: reference
            required: true
            options:
              collection: trips
              search: "name,fields.name,fields.id"
              value: "{fields.id}"
              label: "{primary} ({fields.id})"
      - name: experience
        label: Experience dates (optional)
        type: object
        required: true
        description: "When the experience happened, independently of publication. Leave unknown dates blank."
        fields:
          - name: startDate
            label: Start date
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
          - name: endDate
            label: End date
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
      - name: body
        type: rich-text
  - name: gallery
    label: Gallery
    type: collection
    path: src/content/gallery
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: image
        type: image
        required: true
        options:
          extensions: [jpg, jpeg, png, webp, avif]
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: categories
        type: reference
        required: true
        options:
          collection: galleryCategories
          multiple: true
          min: 1
          value: "{primary}"
          label: "{primary}"
      - name: relatedPost
        label: Related post (optional)
        type: reference
        options:
          collection: posts
          value: "{path}"
          label: "{primary}"
      - name: showOnHomepage
        label: Show on homepage
        type: boolean
        default: false
  - name: galleryCategories
    label: Gallery Categories
    type: collection
    path: src/content/gallery-categories
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        type: string
        required: true
  - name: places
    label: Places
    type: collection
    path: src/content/places
    format: json
    filename: "{fields.id}.json"
    view:
      primary: name
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "Choose a unique ID on creation. Keep it and the filename unchanged; Trips store this ID. Do not delete a Place used by a Trip: references are not automatically repaired."
      - name: name
        type: string
        required: true
      - name: latitude
        type: number
        required: true
        options:
          min: -90
          max: 90
          step: 0.000001
      - name: longitude
        type: number
        required: true
        options:
          min: -180
          max: 180
          step: 0.000001
      - name: description
        type: text
        required: true
      - name: status
        type: select
        required: true
        options:
          multiple: true
          values:
            - label: Ridden
              value: ridden
            - label: Visited
              value: visited
            - label: Wishlist
              value: wishlist
      - name: coverImage
        label: Cover photo (optional)
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, avif]
  - name: trips
    label: Trips
    type: collection
    path: src/content/trips
    format: json
    filename: "{fields.id}.json"
    view:
      primary: name
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "Choose a unique ID on creation. Keep it and the filename unchanged after saving."
      - name: name
        type: string
        required: true
      - name: startDate
        label: Start date (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: places
        label: Places in visiting order
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: false
            summary: "{index}: {fields.place}"
        description: "Add one row per visit, including return visits. Drag rows to change visiting order."
        fields:
          - name: place
            type: reference
            required: true
            options:
              collection: places
              search: "name,fields.name,fields.id"
              value: "{fields.id}"
              label: "{primary} ({fields.id})"
      - name: description
        label: Description (optional)
        type: text
